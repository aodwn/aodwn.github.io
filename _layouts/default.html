<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }}</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap">
    <style>
        :root {
            --bg: #08080a;
            --card: rgba(22, 22, 26, 0.9);
            --accent: #3b82f6;
            --text: #f4f4f5;
            --sub: #a1a1aa;
            --border: rgba(255, 255, 255, 0.08);
            --shadow: 0 20px 40px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.05);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: var(--bg); color: var(--text); line-height: 1.6; }
        .container { max-width: 1200px; margin: 0 auto; padding: 60px 20px; }

        /* Bento Grid */
        .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 24px; }
        .card { 
            background: var(--card); border: 1px solid var(--border); border-radius: 32px; 
            padding: 40px; box-shadow: var(--shadow); backdrop-filter: blur(12px);
            transition: transform 0.3s ease; display: flex; flex-direction: column;
        }
        .card:hover { transform: translateY(-5px); border-color: var(--accent); }
        .c-main { grid-column: span 2; grid-row: span 2; justify-content: flex-end; }
        .c-wide { grid-column: span 2; }
        .c-tall { grid-row: span 2; }

        /* Text Styles */
        .label { color: var(--accent); font-weight: 800; font-size: 0.8rem; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 12px; }
        h1 { font-size: 3rem; line-height: 1.1; margin-bottom: 20px; font-weight: 800; }
        h2 { font-size: 1.5rem; margin-bottom: 15px; }
        p { color: var(--sub); font-size: 1rem; }

        .tag-group { display: flex; flex-wrap: wrap; gap: 8px; margin-top: auto; }
        .tag { background: rgba(255,255,255,0.05); padding: 6px 14px; border-radius: 10px; font-size: 0.8rem; font-weight: 600; }

        @media (max-width: 1024px) { .grid { grid-template-columns: repeat(2, 1fr); } .c-main { grid-column: span 2; } }
        @media (max-width: 640px) { .grid { display: flex; flex-direction: column; } }
    </style>
</head>
<body>
    <div class="container">
        {{ content }}
    </div>
</body>
</html>
